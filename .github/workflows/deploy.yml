name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: jobbot
          POSTGRES_USER: jobbot
          POSTGRES_PASSWORD: jobbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U jobbot -d jobbot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://jobbot:jobbot@localhost:5432/jobbot
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Run test suite
        run: pytest tests -q

  deploy:
    runs-on: ubuntu-latest
    needs: test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Start SSH agent
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Trigger remote deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_AUTO_UPDATE_UNIT: ${{ secrets.DEPLOY_AUTO_UPDATE_UNIT }}
        run: |
          set -euo pipefail
          : "${DEPLOY_HOST:?Missing DEPLOY_HOST secret}"
          : "${DEPLOY_USER:?Missing DEPLOY_USER secret}"

          DEPLOY_PORT="${DEPLOY_PORT:-22}"
          DEPLOY_AUTO_UPDATE_UNIT="${DEPLOY_AUTO_UPDATE_UNIT:-job-bot-auto-update.service}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          ssh-keyscan -p "${DEPLOY_PORT}" -H "${DEPLOY_HOST}" >> ~/.ssh/known_hosts

          ssh -p "${DEPLOY_PORT}" "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "sudo systemctl start '${DEPLOY_AUTO_UPDATE_UNIT}' && sudo systemctl status '${DEPLOY_AUTO_UPDATE_UNIT}' --no-pager"
